---
breaking_changes:
  - "appliance_networking_interfaces_ipv4 - The ``state`` parameter now accepts ``present`` instead
    of ``set``. Playbooks that explicitly set ``state: set`` must be updated to ``state: present``."
  - "appliance_networking_interfaces_ipv6 - The ``state`` parameter now accepts ``present`` instead
    of ``set``. Playbooks that explicitly set ``state: set`` must be updated to ``state: present``."
minor_changes:
  - appliance_networking_interfaces_info - The redundant ``id`` return value is no longer emitted.
    It only ever echoed back the ``interface_name`` input, which callers already know. Use the
    ``value`` or ``info`` return values for interface details.
bugfixes:
  - appliance_networking_interfaces_ipv4_info - Mark ``interface_name`` as required so the module
    fails clearly during argument validation instead of attempting a request against an incomplete
    endpoint path.
  - appliance_networking_interfaces_ipv6_info - Mark ``interface_name`` as required so the module
    fails clearly during argument validation instead of attempting a request against an incomplete
    endpoint path.
