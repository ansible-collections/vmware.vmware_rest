---
# ============================================================
# VCENTER_VM_GUEST_NETWORKING_ROUTES_INFO TESTS
#
# Read-only module that wraps the guest networking routes GET endpoint. This
# endpoint returns an array of network routes, so when more than one route is
# reported `value` is a list (mirrored by `info`). There is no LIST endpoint
# parameter and the module never changes state.
# ============================================================

# Test 1: Get the guest network routing table of a VM
- name: Gather the guest networking routes
  vmware.vmware_rest.vcenter_vm_guest_networking_routes_info:
    vm: vm-1234
  register: routes_info

- name: Assert the guest routing table is returned
  ansible.builtin.assert:
    that:
      - not routes_info.changed
      - routes_info.value is defined
      - routes_info.value | length == 2
      - routes_info.value[0].network == '0.0.0.0'
      - routes_info.value[0].prefix_length == 0
      - routes_info.value[0].gateway_address == '10.0.2.2'
      - routes_info.value[1].network == '10.0.2.0'
      - routes_info.value[1].prefix_length == 24
      - routes_info.info is defined
      - routes_info.info | length == 2
      - routes_info.info[0].network == '0.0.0.0'

# Test 2: Check mode returns the same read-only result without error
- name: Gather the guest networking routes (check mode)
  vmware.vmware_rest.vcenter_vm_guest_networking_routes_info:
    vm: vm-1234
  check_mode: true
  register: routes_info_check

- name: Assert check mode reports no change for read-only info module
  ansible.builtin.assert:
    that:
      - not routes_info_check.changed
      - routes_info_check.value | length == 2
      - routes_info_check.value[0].network == '0.0.0.0'

# Test 3: A VM whose routing information is unavailable returns an empty result
- name: Reset before not-found expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for missing routing data
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Vcenter.Vm.Guest.Networking.Routes_list: "404"

- name: Gather routing info for a VM with no data
  vmware.vmware_rest.vcenter_vm_guest_networking_routes_info:
    vm: vm-9999
  register: routes_missing

- name: Assert an empty result is returned when the data is unavailable
  ansible.builtin.assert:
    that:
      - not routes_missing.changed
      - routes_missing.value == {}
      - routes_missing.info | length == 0
