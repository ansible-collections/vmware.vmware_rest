---
# ============================================================
# VM STORAGE POLICY INFO TESTS
# ============================================================
# The info module is GET-only and requires a vm MOID. It returns the storage
# policies associated with a single virtual machine's home directory and disks
# (there is no list endpoint), so value always collapses to a single dict.

- name: Get storage policy for a vm
  vmware.vmware_rest.vcenter_vm_storage_policy_info:
    vm: vm-1001
  register: policy

- name: Assert storage policy details
  ansible.builtin.assert:
    that:
      - policy.value is defined
      - policy.value.vm_home == 'aa6d5a82-1c88-45da-85d3-3d74b91a5bad'
      - policy.value.disks['2000'] == 'aa6d5a82-1c88-45da-85d3-3d74b91a5bad'
      - policy.info is defined
      - policy.info | length == 1
      - policy.info[0].vm_home == 'aa6d5a82-1c88-45da-85d3-3d74b91a5bad'
