---
# ============================================================
# VM STORAGE POLICY COMPLIANCE ACTION TESTS
# ============================================================
# The CRUD module exposes a single, non-idempotent action (state=check) that
# POSTs to .../storage/policy/compliance?action=check and returns the freshly
# computed compliance Info. Tests assert the module reports the change, surfaces
# the API response under `value`, and skips the API call in check mode.

# ------------------------------------------------------------
# Test 1: run the compliance check action
# ------------------------------------------------------------
- name: Reset before check action expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Add check POST expectation
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/expectation"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      - httpRequest:
          method: POST
          path: "/api/vcenter/vm/vm-1001/storage/policy/compliance"
          queryStringParameters:
            action:
              - check
        httpResponse:
          statusCode: 200
          headers:
            Content-Type:
              - "application/json"
          body: >-
            {"overall_compliance": "COMPLIANT",
             "vm_home": {"status": "COMPLIANT", "check_time": "2026-09-14T10:00:00.000Z", "policy": "policy-42"},
             "disks": {"2000": {"status": "COMPLIANT", "check_time": "2026-09-14T10:00:00.000Z", "policy": "policy-42"}}}

- name: Run the storage policy compliance check
  vmware.vmware_rest.vcenter_vm_storage_policy_compliance:
    vm: vm-1001
    state: check
    vm_home: true
  register: check_result

- name: Assert check action succeeded and returned compliance data
  ansible.builtin.assert:
    that:
      - check_result.changed
      - check_result.id == 'vm-1001'
      - check_result.value.overall_compliance == 'COMPLIANT'
      - check_result.value.vm_home.status == 'COMPLIANT'
      - check_result.value.disks['2000'].status == 'COMPLIANT'

# ------------------------------------------------------------
# Test 2: run the check action in check mode (no API call is made)
# ------------------------------------------------------------
- name: Run the compliance check in check mode
  vmware.vmware_rest.vcenter_vm_storage_policy_compliance:
    vm: vm-1001
    state: check
    vm_home: true
  check_mode: true
  register: check_check_mode

- name: Assert check mode reports change without calling the API
  ansible.builtin.assert:
    that:
      - check_check_mode.changed
      - check_check_mode.id == 'vm-1001'
      - check_check_mode.value == {}
