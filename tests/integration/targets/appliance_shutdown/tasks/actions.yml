---
# ============================================================
# APPLIANCE SHUTDOWN ACTION TESTS
# ============================================================

# Test 1: Reboot action
- name: Reset before reboot action expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load GET expectation for reboot test
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.Shutdown_get: "200"

- name: Add reboot POST expectation
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/expectation"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      - httpRequest:
          method: POST
          path: "/api/appliance/shutdown"
          queryStringParameters:
            action:
              - reboot
        httpResponse:
          statusCode: 200
          headers:
            Content-Type:
              - "application/json"
          body: "{}"

- name: Schedule a reboot
  vmware.vmware_rest.appliance_shutdown:
    state: reboot
    delay: 10
    reason: Scheduled maintenance
  register: reboot_result

- name: Assert reboot action succeeded
  ansible.builtin.assert:
    that:
      - reboot_result.changed
      - reboot_result.value is defined

# Test 2: Reboot in check mode
- name: Reset before reboot check mode expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load GET expectation for reboot check mode
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Appliance.Shutdown_get: "200"

- name: Schedule a reboot in check mode
  vmware.vmware_rest.appliance_shutdown:
    state: reboot
    delay: 5
    reason: Test reboot
  check_mode: true
  register: reboot_check

- name: Assert reboot check mode reports change
  ansible.builtin.assert:
    that:
      - reboot_check.changed
      - reboot_check.value == {}

