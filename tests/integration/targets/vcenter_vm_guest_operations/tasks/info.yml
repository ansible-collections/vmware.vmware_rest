---
# ============================================================
# VCENTER_VM_GUEST_OPERATIONS_INFO TESTS
#
# Read-only module that wraps the guest operations GET endpoint. It reports
# whether guest and interactive guest operations are available for a single
# VM, so `value` is a dict and `info` is a single-element list. There is no
# LIST endpoint and the module never changes state.
# ============================================================

# Test 1: Get the guest operations readiness of a VM
- name: Gather the guest operations information
  vmware.vmware_rest.vcenter_vm_guest_operations_info:
    vm: vm-1234
  register: ops_info

- name: Assert guest operations readiness is returned
  ansible.builtin.assert:
    that:
      - not ops_info.changed
      - ops_info.value is defined
      - ops_info.value.guest_operations_ready
      - not ops_info.value.interactive_guest_operations_ready
      - ops_info.info is defined
      - ops_info.info | length == 1
      - ops_info.info[0].guest_operations_ready

# Test 2: Check mode returns the same read-only result without error
- name: Gather the guest operations information (check mode)
  vmware.vmware_rest.vcenter_vm_guest_operations_info:
    vm: vm-1234
  check_mode: true
  register: ops_info_check

- name: Assert check mode reports no change for read-only info module
  ansible.builtin.assert:
    that:
      - not ops_info_check.changed
      - ops_info_check.value is defined
      - ops_info_check.value.guest_operations_ready

# Test 3: A VM whose guest operations data is unavailable returns an empty result
- name: Reset before not-found expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for missing guest operations data
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Vcenter.Vm.Guest.Operations_get: "404"

- name: Gather guest operations info for a VM with no data
  vmware.vmware_rest.vcenter_vm_guest_operations_info:
    vm: vm-9999
  register: ops_missing

- name: Assert an empty result is returned when the data is unavailable
  ansible.builtin.assert:
    that:
      - not ops_missing.changed
      - ops_missing.value == {}
      - ops_missing.info | length == 0
