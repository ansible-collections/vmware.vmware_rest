---
# ============================================================
# CONTENT_LIBRARY_SUBSCRIPTIONS_INFO TESTS
# ============================================================
# Read-only info module backed by the
# /content/library/{library}/subscriptions LIST and
# /content/library/{library}/subscriptions/{subscription} GET endpoints.
# The `library` parameter is required for every query. Results are always
# returned as both `info` (list[dict]) and `value`.

# Test 1: List subscriptions of a published library when none exist
- name: List subscriptions (empty)
  vmware.vmware_rest.content_library_subscriptions_info:
    library: library-1001
  register: list_empty

- name: Assert empty list
  ansible.builtin.assert:
    that:
      - list_empty.info is defined
      - list_empty.info | length == 0
      - not list_empty.changed

# Test 2: Get a single subscription by ID
- name: Reset before get expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for get
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Content.Library.Subscriptions_get: "200"

- name: Get a subscription by ID
  vmware.vmware_rest.content_library_subscriptions_info:
    library: library-1001
    subscription: subscriptions-1001
  register: get_by_id

- name: Assert single subscription details
  ansible.builtin.assert:
    that:
      - get_by_id.value is defined
      - get_by_id.value.name == 'my_subscriptions'
      - get_by_id.info is defined
      - get_by_id.info | length == 1
      - get_by_id.info[0].name == 'my_subscriptions'
      - not get_by_id.changed

# Test 3: List multiple subscriptions
- name: Reset before multiple list expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for multiple
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/list_multiple.json"
      operationsAndResponses:
        Content.Library.Subscriptions_list: "200"
        Content.Library.Subscriptions_get: "200"

- name: List subscriptions (multiple)
  vmware.vmware_rest.content_library_subscriptions_info:
    library: library-1001
  register: list_multiple

- name: Assert multiple subscriptions listed
  ansible.builtin.assert:
    that:
      - list_multiple.value is defined
      - list_multiple.value | length == 2
      - list_multiple.info is defined
      - list_multiple.info | length == 2
      - not list_multiple.changed

# Test 4: Check mode returns the same read-only result without error
- name: Get a subscription by ID (check mode)
  vmware.vmware_rest.content_library_subscriptions_info:
    library: library-1001
    subscription: subscriptions-1001
  check_mode: true
  register: get_check

- name: Assert check mode reports no change for read-only info module
  ansible.builtin.assert:
    that:
      - get_check.value is defined
      - not get_check.changed
