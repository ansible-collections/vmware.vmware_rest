---
# The /appliance/vmon/service endpoints only exist in the vSphere 8.0.2 API
# spec, so these mocks and tests are modeled from that spec rather than the
# 9.x spec used by most modules in this collection.
- name: Test appliance_vmon_service modules against MockServer
  environment: "{{ environment_auth_vars }}"
  block:
    - name: Load default API spec expectations
      ansible.builtin.uri:
        url: "{{ mockserver_url }}/mockserver/openapi"
        method: PUT
        status_code: [200, 201]
        body_format: json
        body:
          specUrlOrPayload: "file:/mockserver_specs/default.json"
          operationsAndResponses:
            Appliance.Vmon.Service_list: "200"

    - name: Include info tests
      ansible.builtin.include_tasks: info.yml

    - name: Include update tests
      ansible.builtin.include_tasks: update.yml

    - name: Include action tests
      ansible.builtin.include_tasks: actions.yml
