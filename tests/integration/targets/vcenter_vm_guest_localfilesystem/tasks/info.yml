---
# ============================================================
# VCENTER_VM_GUEST_LOCALFILESYSTEM_INFO TESTS
#
# Read-only module that wraps the guest local file system GET endpoint. It
# always describes a single VM, so `value` is a dict (keyed by mount point)
# and `info` is a single-element list. There is no LIST endpoint and the
# module never changes state.
# ============================================================

# Test 1: Get the local file systems of a VM
- name: Gather the guest local file system information
  vmware.vmware_rest.vcenter_vm_guest_localfilesystem_info:
    vm: vm-1234
  register: fs_info

- name: Assert local file system details are returned
  ansible.builtin.assert:
    that:
      - not fs_info.changed
      - fs_info.value is defined
      - fs_info.value['/'].capacity == 21462233088
      - fs_info.value['/'].free_space == 8927387648
      - fs_info.value['/'].filesystem == 'ext4'
      - fs_info.value['/'].mappings[0].disk == '2000'
      - fs_info.value['/boot'].capacity == 1063256064
      - fs_info.info is defined
      - fs_info.info | length == 1
      - fs_info.info[0]['/'].free_space == 8927387648

# Test 2: Check mode returns the same read-only result without error
- name: Gather the guest local file system information (check mode)
  vmware.vmware_rest.vcenter_vm_guest_localfilesystem_info:
    vm: vm-1234
  check_mode: true
  register: fs_info_check

- name: Assert check mode reports no change for read-only info module
  ansible.builtin.assert:
    that:
      - not fs_info_check.changed
      - fs_info_check.value is defined
      - fs_info_check.value['/'].filesystem == 'ext4'

# Test 3: A VM whose local file system data is unavailable returns an empty result
- name: Reset before not-found expectations
  ansible.builtin.include_role:
    name: prepare_simulator
  vars:
    prepare_simulator_reset: true

- name: Load API spec expectations for missing local file system data
  ansible.builtin.uri:
    url: "{{ mockserver_url }}/mockserver/openapi"
    method: PUT
    status_code: [200, 201]
    body_format: json
    body:
      specUrlOrPayload: "file:/mockserver_specs/default.json"
      operationsAndResponses:
        Vcenter.Vm.Guest.LocalFilesystem_get: "404"

- name: Gather local file system info for a VM with no data
  vmware.vmware_rest.vcenter_vm_guest_localfilesystem_info:
    vm: vm-9999
  register: fs_missing

- name: Assert an empty result is returned when the data is unavailable
  ansible.builtin.assert:
    that:
      - not fs_missing.changed
      - fs_missing.value == {}
      - fs_missing.info | length == 0
